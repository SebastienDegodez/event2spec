    top: 2.7
    width: 12.0
    height: 0.9
    text: "Quelques jours après l'atelier de domaine, quatre personnes se réunissent : les deux architectes et les deux développeurs qui maîtrisent l'Event Storming. Le mur produit par les 23 participants est là, complet mais plat. L'enjeu est d'en tirer des frontières — aggregates et bounded contexts — sans trahir ce que les experts métier ont dit, et sans que les quatre y passent trois semaines."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.7
    width: 12.0
    height: 0.4
    text: "Scenario Narrative"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.2
    width: 12.0
    height: 1.4
    text: "Aujourd'hui, cette séance n'a pas lieu, ou elle a lieu de façon informelle et non tracée. Un architecte regarde le résultat de l'atelier, y reconnaît vaguement des zones, et propose un découpage qui reflète surtout sa connaissance préalable du système existant. Personne ne peut vérifier si ce découpage suit réellement la matière produite par le métier ou s'il reproduit l'organigramme actuel. Le lien entre ce qu'ont dit les six experts dommage aux biens et les frontières retenues est perdu.\n\nCe qui rend cette séance difficile n'est pas le manque de compétence : les deux architectes savent ce qu'est un bounded context. C'est le volume et la platitude de la matière. Un mur d'Event Storming issu d'une séance à 23 personnes contient des dizaines d'événements, des commandes, des policies, des systèmes externes — et aucune indication de regroupement. Identifier manuellement les zones de cohérence demande de tout relire, plusieurs fois, en tenant en tête des dépendances qui ne sont pas représentées.\n\nL'enjeu dépasse le confort de ces quatre personnes. Un découpage qui ne s'appuie pas sur le langage réel du métier produit des frontières fragiles, qui se fissurent à la première évolution. Chez un assureur, sur un domaine dommage aux biens qui va être reconstruit, cette fragilité se paie sur plusieurs années.\n\nLe succès ressemblerait à ceci : l'assistant propose plusieurs découpages candidats à partir du mur, chacun justifié par les éléments qui le fondent. Les quatre participants les examinent, en contestent une partie, en fusionnent deux, en écartent un troisième. Chaque frontière retenue reste remontable jusqu'à la parole métier qui l'a produite. La séance dure une demi-journée au lieu de trois semaines, et le résultat est défendable devant un comité d'architecture."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 5.7
    width: 12.0
    height: 0.4
    text: "How Might We"
    font: "Segoe UI"
    font_size: 12
