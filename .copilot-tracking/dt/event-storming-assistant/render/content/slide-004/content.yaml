    font_bold: true

  - type: textbox
    left: 0.6
    top: 6.2
    width: 12.0
    height: 0.5
    text: "Comment pourrions-nous transformer un mur d'Event Storming brut en propositions de découpage inspectables et contestables, pour que les architectes exercent leur jugement sur des candidats argumentés plutôt que sur une page blanche — sans jamais leur imposer une frontière qu'ils n'ont pas choisie ?\n\nDébloquer ce scénario donne au programme un découpage traçable jusqu'à la parole métier, réduit le délai entre l'atelier et la décision d'architecture, et produit la matière nécessaire au dossier d'architecture technique. C'est aussi la partie de l'outil qui ne dépend d'aucun enregistrement audio : elle reste réalisable même si la conformité interdit la transcription.\n\n#### Questions to Ask\n\n1. Comment les architectes identifient-ils un bounded context aujourd'hui, concrètement ?\n2. Combien de découpages candidats sont utiles — un, trois, dix ?\n3. Quelle justification rend une proposition automatique recevable à leurs yeux ?\n4. Que se passe-t-il si le mur produit en séance A est incomplet ou incohérent ?\n5. Cette séance a-t-elle lieu une fois, ou de façon itérative au fil de plusieurs ateliers ?"
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

