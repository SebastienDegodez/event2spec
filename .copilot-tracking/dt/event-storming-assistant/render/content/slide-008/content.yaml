    top: 2.7
    width: 12.0
    height: 2.8
    text: "- **Découpages concurrents** — l'assistant propose plusieurs partitions différentes et les architectes les comparent.\n- **Mur importé** — le découpage s'applique à un Event Storming réalisé ailleurs, sans passer par le mode Captation.\n- **Mur incomplet** — l'assistant signale les zones trop pauvres pour fonder une frontière plutôt que de proposer à l'aveugle.\n- **Reprise itérative** — le découpage est révisé après un atelier complémentaire.\n- **Désaccord entre architectes** — les deux découpages sont conservés côte à côte, à la manière d'un hotspot."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

