  - type: textbox
    left: 0.6
    top: 2.7
    width: 12.0
    height: 0.8
    text: "Pendant un atelier Event Storming en distanciel, l'assistant écoute la conversation, propose des éléments de notation Event Storming correspondant à ce qui vient d'être dit, et ne les inscrit sur le mur qu'après validation du groupe."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.6
    width: 12.0
    height: 0.4
    text: "Overview"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.1
    width: 12.0
    height: 0.8
    text: "Le coach agile anime une séance de cadrage du domaine dommage aux biens avec 23 participants en visio. Les experts métier décrivent leurs processus en langage naturel, avec des digressions, des retours en arrière et des désaccords. Historiquement, un développeur connaissant la méthode transcrit ces échanges en post-its à la main, ce qui l'empêche de contribuer.\n\nL'assistant prend en charge cette transcription. Il écoute le flux audio, en extrait des candidats de notation Event Storming — domain event, command, actor, policy, read model, système externe, hotspot — et les présente au groupe comme des propositions. Le groupe accepte, corrige ou rejette. L'assistant place ensuite les éléments acceptés sur la chronologie et signale les écarts de grammaire, sans jamais trancher un désaccord métier ni décider de l'avancement de la séance."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 5.0
    width: 12.0
    height: 0.4
    text: "Business Value"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 5.5
    width: 12.0
    height: 0.9
    text: "La valeur principale est la restitution de la capacité de contribution des deux seules personnes maîtrisant la méthode. Elle se double d'une valeur de traçabilité : chaque élément du modèle reste rattaché au passage de conversation qui l'a produit, ce qui rend le modèle défendable, révisable et exploitable en aval.\n\nBénéficiaires et effets attendus :\n\n| Bénéficiaire | Effet | |---|---| | Développeurs praticiens | Redeviennent contributeurs au lieu de scribes | | Coach agile | Anime sans maîtriser la notation | | Experts métier | Leur parole est retenue fidèlement, avec ses nuances | | Architectes | Un modèle structuré, base du futur découpage | | Programme | Un cadrage de durée prévisible, exploitable par la chaîne de dev |\n\nIndicateurs pertinents : proportion de post-its issus de la parole des experts métier, nombre de participants ayant contribué, part des propositions de l'IA acceptées sans correction, temps entre la fin de l'atelier et un modèle utilisable."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

