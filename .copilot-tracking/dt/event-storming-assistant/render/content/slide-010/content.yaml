  - type: textbox
    left: 0.6
    top: 2.7
    width: 5.8
    height: 0.7
    text: "Le coach agile facilitateur. Il anime, distribue la parole et tient le rythme. Il ne connaît pas l'Event Storming et ne veut pas l'apprendre avant septembre. Sa contrainte forte : garder la main sur la conversation et ne pas laisser l'outil capter l'attention du groupe."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 6.6
    top: 2.2
    width: 5.8
    height: 0.4
    text: "Secondary User"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 6.6
    top: 2.7
    width: 5.8
    height: 0.7
    text: "Les deux développeurs praticiens de l'Event Storming, qui basculent du rôle de facilitateur à celui de contributeur et deviennent les contrôleurs qualité implicites des propositions de l'IA. Les six experts métier dommage aux biens, dont la parole alimente le modèle. Les deux architectes, consommateurs aval du modèle produit."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.5
    width: 12.0
    height: 0.4
    text: "Preconditions"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.0
    width: 12.0
    height: 0.6
    text: "- Une séance en visio est en cours avec les participants connectés.\n- L'objectif de la séance et le niveau visé (Big Picture ou Process Modeling) sont posés.\n- Le consentement à l'enregistrement et à la conservation des transcriptions est acquis pour tous les participants, y compris les consultants externes.\n- Le mur est initialisé, vide ou pré-amorcé."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 4.65
    width: 12.0
    height: 0.4
    text: "Steps"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 5.1
    width: 12.0
    height: 0.9
    text: "1. Le coach agile démarre l'écoute live depuis le panneau de transcription.\n2. Les participants discutent librement du processus dommage aux biens.\n3. L'assistant transcrit le flux audio en continu et conserve la transcription en markdown, versionnée dans un dépôt Git.\n4. **À la pause de séance**, l'assistant analyse le segment écoulé et identifie des candidats de notation Event Storming.\n5. L'assistant matérialise ces candidats dans une **couche fantôme** visuellement distincte des post-its du groupe, chacun rattaché à l'extrait de transcription dont il provient.\n6. À la reprise, le groupe examine les propositions : adopte d'un clic, reformule ou ignore.\n7. L'assistant place les éléments adoptés sur la chronologie et met à jour le mur.\n8. Les propositions non adoptées à la fin de l'exercice **disparaissent**. Ne rien faire vaut refus.\n9. Lorsqu'un élément adopté enfreint la grammaire, l'assistant le signale sans bloquer.\n10. En fin de séance, le modèle et la transcription complète sont conservés ensemble dans le dépôt."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 6.05
    width: 12.0
    height: 0.4
    text: "Data Requirements"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 6.45
    width: 12.0
    height: 0.35
    text: "**Nécessaire en entrée** : flux audio de la visio, éventuels apports texte des participants, notation Event Storming de référence, et à terme le vocabulaire métier dommage aux biens.\n\n**Créé ou modifié** : transcription horodatée et conservée, éléments de notation avec leur type, leur position sur la chronologie et leurs liens, lien de traçabilité entre chaque élément et son extrait source, journal des propositions acceptées et rejetées, historique des versions du mur.\n\nLe lien élément ↔ extrait de transcription est structurant : c'est lui qui fonde la confiance du développeur praticien, et c'est lui qui permettra plus tard de dériver aggregates et bounded contexts sans repartir de zéro."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

