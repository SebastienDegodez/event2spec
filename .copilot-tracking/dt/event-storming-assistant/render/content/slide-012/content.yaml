    top: 2.7
    width: 12.0
    height: 2.8
    text: "- **Apport par texte** — un participant qui n'ose pas parler soumet un élément par écrit ; utile pour contrer le silence en visio.\n- **Transcription importée** — l'atelier a été enregistré ailleurs ; l'analyse s'effectue a posteriori, sans écoute live.\n- **Hotspot** — le groupe est en désaccord ; l'assistant marque le point sans trancher, conformément à la notation Event Storming.\n- **Mode dégradé sans enregistrement** — si la conformité l'interdit, seule la saisie texte reste disponible.\n- **Reprise de séance** — la modélisation se poursuit sur une séance ultérieure à partir du mur existant."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
