  - type: textbox
    left: 0.6
    top: 2.7
    width: 12.0
    height: 0.7
    text: "Architecte solution ou architecte d'entreprise du programme de transformation. L'un raisonne à l'échelle du système à construire, l'autre à l'échelle du patrimoine applicatif de l'assureur. Tous deux sont présents à l'atelier de septembre et deviennent, avec la décision du 2026-08-04, les **valideurs du mode Dérivation** : c'est à eux que l'assistant soumet ses propositions d'aggregates et de bounded contexts. Ils passent ainsi de consommateurs aval à utilisateurs directs de l'outil."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.5
    width: 12.0
    height: 0.4
    text: "Goal"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.0
    width: 12.0
    height: 0.7
    text: "Obtenir un découpage du domaine dommage aux biens qui tienne dans la durée — des frontières qui ne se fissurent pas à la première évolution métier — et pouvoir le justifier devant un comité d'architecture avec autre chose qu'une intuition."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 4.8
    width: 12.0
    height: 0.4
    text: "Needs"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 5.3
    width: 12.0
    height: 0.7
    text: "**Besoins explicites**\n\n- Un modèle du domaine assez complet et assez propre pour qu'un découpage puisse s'y appuyer.\n- Voir sur quoi repose chaque frontière proposée : quels événements, quelles commandes, quelles dépendances.\n- Pouvoir modifier une proposition sans repartir de zéro.\n\n**Besoins latents**\n\n- Ne pas être mis devant un découpage déjà figé qu'ils n'ont plus qu'à entériner.\n- Explorer plusieurs découpages concurrents plutôt qu'en recevoir un seul.\n- Remonter du découpage à la parole métier qui le fonde, pour arbitrer un cas limite."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 6.1
    width: 12.0
    height: 0.3
    text: "Mindset"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 6.45
    width: 12.0
    height: 0.25
    text: "Ils savent qu'un mauvais découpage coûte des années et qu'il ne se révèle qu'après coup. Cette conscience les rend prudents et sceptiques face à toute proposition automatique : un bounded context plausible mais faux est plus dangereux qu'une absence de proposition, parce qu'il emporte l'adhésion du reste de l'équipe.\n\nLeur critère d'acceptation n'est pas la justesse apparente du résultat mais la **traçabilité du raisonnement**. Une proposition qu'ils peuvent inspecter, contester et amender sera examinée ; un découpage livré comme un verdict sera rejeté, même s'il est bon. Ils veulent un outil qui les fasse penser, pas un outil qui pense à leur place.\n\n#### Questions to Ask\n\n1. Comment procèdent-ils aujourd'hui pour identifier un bounded context, sans outil ?\n2. Ont-ils déjà vécu un découpage raté dans cette organisation, et qu'en ont-ils appris ?\n3. Quelle forme de justification leur suffirait pour accepter une proposition automatique ?\n4. Combien de découpages alternatifs souhaitent-ils voir en parallèle ?\n5. Que doivent-ils emporter de la séance de septembre pour rester engagés ?"
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

