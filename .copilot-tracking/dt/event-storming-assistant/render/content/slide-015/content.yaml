  - type: textbox
    left: 0.6
    top: 2.7
    width: 12.0
    height: 0.7
    text: "Coach agile rattaché au conseil interne, présent à l'atelier de septembre. Il sait faire parler un groupe, gérer les silences, tenir un timing et désamorcer un conflit — c'est son métier depuis des années. Ce qu'il ne connaît pas, c'est l'Event Storming : ni la notation, ni la grammaire, ni les pièges spécifiques de la méthode. Il est le persona primaire de l'outil parce qu'il est celui à qui l'on veut transférer la capacité d'animer, sans lui demander de devenir expert de la méthode."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.5
    width: 12.0
    height: 0.4
    text: "Goal"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.0
    width: 12.0
    height: 0.7
    text: "Animer un atelier Event Storming de 23 personnes en distanciel, et en sortir avec un modèle du domaine dommage aux biens que le groupe reconnaît comme le sien — sans avoir à apprendre la méthode en profondeur avant septembre."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 4.8
    width: 12.0
    height: 0.4
    text: "Needs"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 5.3
    width: 12.0
    height: 0.7
    text: "**Besoins explicites**\n\n- Savoir quelle est l'étape en cours et quand passer à la suivante.\n- Savoir si ce que le groupe produit est conforme à la méthode, sans devoir en juger lui-même.\n- Un support visuel que 23 personnes en visio peuvent suivre ensemble.\n\n**Besoins latents**\n\n- Ne pas perdre son autorité de facilitateur en révélant qu'il ne maîtrise pas la méthode devant des architectes et des consultants externes.\n- Garder la main sur le rythme et la parole — c'est précisément là qu'est sa valeur, et il ne veut pas que l'outil la lui prenne.\n- Détecter que 17 personnes se taisent pendant que 3 parlent, et pouvoir y remédier."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 6.1
    width: 12.0
    height: 0.3
    text: "Mindset"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 6.45
    width: 12.0
    height: 0.25
    text: "Il croit que la qualité d'un atelier vient de la qualité de la conversation, pas de la qualité de l'outil. Il se méfie des dispositifs qui mettent les gens face à un écran plutôt que face aux autres. Un outil qui capte l'attention du groupe est pour lui un échec, même s'il produit un beau livrable.\n\nIl raisonne en termes de sécurité psychologique et d'engagement : son indicateur de réussite n'est pas le nombre de post-its produits, c'est le nombre de personnes qui ont parlé. Il accueillera volontiers une IA qui lui dit « cet élément n'est pas au bon format », et beaucoup moins une IA qui décide que la discussion doit avancer."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

