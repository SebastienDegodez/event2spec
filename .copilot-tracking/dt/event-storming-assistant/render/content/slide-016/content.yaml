    font_bold: true

  - type: textbox
    left: 0.6
    top: 2.7
    width: 12.0
    height: 0.7
    text: "Développeur senior dans le programme de transformation, l'un des deux seuls à avoir réellement pratiqué l'Event Storming. Il connaît la notation, la grammaire `Event → Policy → Command → System → Event`, et il sait à quoi ressemble un atelier qui marche. Il n'a pas de mandat de facilitateur : c'est sa compétence, pas son rôle. Il compte pour le projet parce qu'il est simultanément le seul porteur de la méthode et un contributeur technique attendu sur le contenu."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 3.5
    width: 12.0
    height: 0.4
    text: "Goal"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 4.0
    width: 12.0
    height: 0.7
    text: "Que l'atelier produise un modèle du domaine dommage aux biens suffisamment juste et structuré pour qu'on puisse construire dessus — et pouvoir y contribuer lui-même, avec sa compréhension du système existant, au lieu de passer la séance à écrire ce que disent les autres."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 4.8
    width: 12.0
    height: 0.4
    text: "Needs"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 5.3
    width: 12.0
    height: 0.7
    text: "**Besoins explicites**\n\n- Que quelqu'un ou quelque chose écrive et place les post-its à sa place.\n- Que la chronologie se tienne toute seule quand la discussion revient en arrière.\n- Que les écarts de notation soient signalés sans qu'il ait à interrompre le groupe.\n\n**Besoins latents**\n\n- Ne pas être le point de défaillance unique du programme sur cette méthode.\n- Pouvoir contester le modèle en tant que participant, ce que sa position de facilitateur lui interdit socialement.\n- Que la trace de la conversation subsiste, pour pouvoir revenir sur un choix trois semaines plus tard sans reconstituer de mémoire."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

  - type: textbox
    left: 0.6
    top: 6.1
    width: 12.0
    height: 0.3
    text: "Mindset"
    font: "Segoe UI"
    font_size: 12
    font_color: "#4DA3FF"
    font_bold: true

  - type: textbox
    left: 0.6
    top: 6.45
    width: 12.0
    height: 0.25
    text: "Il pense en systèmes et se méfie profondément des outils qui produisent un résultat plausible mais faux. Une IA qui invente un événement qui n'a pas été dit lui coûte plus cher que pas d'IA du tout, parce qu'il devra le détecter et le corriger — et parce que le groupe, lui, ne le détectera pas. Sa confiance se gagne par la traçabilité : montrer quel passage de la discussion a produit quel post-it.\n\nIl est également conscient d'un piège social : s'il anime, son silence est interprété comme un accord. Il préfère un outil médiocre qui le libère plutôt qu'un outil brillant qui le maintient au tableau. Il n'attend pas de l'IA qu'elle anime — il attend qu'elle exécute ce qui est mécanique, et qu'elle s'arrête là."
    font: "Segoe UI"
    font_size: 10
    font_color: "#D7DDEA"
    auto_size: "shrink"

