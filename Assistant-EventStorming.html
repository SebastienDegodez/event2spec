document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; }\n  body { background: var(--surf,#f3f2f2); color: var(--ink,#201e1d); font-family: Archivo, system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }\n  h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.015em; line-height: 1.12; }\n  p { margin: 0; }\n  a { color: var(--acc,#ec3013); text-decoration: none; }\n  a:hover { color: var(--acc-d,#ae1800); }\n  button { font-family: inherit; cursor: pointer; }\n  input, textarea, select { font-family: inherit; }\n  input::placeholder, textarea::placeholder { color: #8a8683; font-weight: 400; letter-spacing: normal; text-transform: none; }\n  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--ink,#201e1d) 45%, var(--surf,#f3f2f2)); }\n  ::selection { background: rgba(236,48,19,.3); }\n  :focus { outline: none; }\n  :focus-visible { outline: 2px solid var(--acc,#ec3013); outline-offset: 2px; }\n  @keyframes ghostpulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isSignIn }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"Connexion\" style=\"min-height:var(--ui-h,100vh);zoom:var(--ui-zoom,1);display:flex;flex-direction:column;background:var(--surf,#f3f2f2)\">\n    <header style=\"flex:none;display:flex;align-items:center;gap:11px;padding:13px 20px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n      <div style=\"width:26px;height:26px;background:var(--acc,#ec3013)\"><\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Assistant Event Storming<\u002Fdiv>\n      <div style=\"margin-left:auto;font-size:11px;letter-spacing:.04em;color:rgba(var(--ink-rgb,32,30,29),.55)\">V0 · maquette fonctionnelle<\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"flex:1;display:flex;flex-wrap:wrap;align-items:stretch\">\n      <div style=\"flex:1 1 0;min-width:300px;padding:clamp(28px,4vw,52px) clamp(22px,3vw,40px);display:flex;flex-direction:column;justify-content:center;border-right:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n        <h1 style=\"font-size:clamp(32px,4.2vw,50px);max-width:19ch\">Un Event Storming ne se conduit pas à vue.<\u002Fh1>\n        <p style=\"margin-top:18px;font-size:16px;line-height:1.5;max-width:56ch;color:rgba(var(--ink-rgb,32,30,29),.7);text-wrap:pretty\">Le déroulé Brandolini tenu de bout en bout : neuf étapes, une validation entre chacune, vingt-trois personnes qui écrivent en même temps, et un modèle qui ressort en markdown versionné.<\u002Fp>\n        <div style=\"margin-top:36px;max-width:58ch;border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <sc-for list=\"{{ pitch }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div style=\"padding:15px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n              <div style=\"font-size:15px;font-weight:800\">{{ f.k }}<\u002Fdiv>\n              <div style=\"font-size:13px;margin-top:3px;color:rgba(var(--ink-rgb,32,30,29),.65);text-wrap:pretty\">{{ f.v }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:0 0 clamp(308px,36%,420px);min-width:308px;padding:clamp(26px,3vw,44px) clamp(20px,2.4vw,34px);background:var(--surf2,#eae9e9);display:flex;flex-direction:column;justify-content:center\">\n        <h2 style=\"font-size:25px\">Ouvrir une session<\u002Fh2>\n        <p style=\"margin-top:8px;font-size:13px;line-height:1.45;color:rgba(var(--ink-rgb,32,30,29),.65);text-wrap:pretty\">Facilitateur et architecte se connectent avec GitHub ou le fournisseur OIDC de l’entreprise. Les participants rejoignent avec le code diffusé en séance.<\u002Fp>\n\n        <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:8px;opacity:{{ providersOpacity }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ gh.onClick }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 15px;border:2px solid {{ gh.border }};background:{{ gh.bg }};color:{{ gh.ink }};font-size:14px;font-weight:800;text-align:left\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 5-2 5-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 2 5.5 5 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4\"><\u002Fpath><path d=\"M9 18c-4.51 2-5-2-7-2\"><\u002Fpath><\u002Fsvg>\n            <span>Continuer avec GitHub<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.68\">{{ gh.tag }}<\u002Fspan>\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ ms.onClick }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 15px;border:2px solid {{ ms.border }};background:{{ ms.bg }};color:{{ ms.ink }};font-size:14px;font-weight:800;text-align:left\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><circle cx=\"8\" cy=\"12\" r=\"4\"><\u002Fcircle><line x1=\"12\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"17\" y1=\"12\" x2=\"17\" y2=\"16\"><\u002Fline><line x1=\"20\" y1=\"12\" x2=\"20\" y2=\"15\"><\u002Fline><\u002Fsvg>\n            <span>Continuer avec votre SSO (OIDC)<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.68\">{{ ms.tag }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ signingOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:13px;display:flex;align-items:center;gap:9px;font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.7)\">\n            <div style=\"flex:none;width:9px;height:9px;background:var(--acc,#ec3013);animation:ghostpulse 1s ease-in-out infinite\"><\u002Fdiv>\n            {{ signingLabel }}\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:28px\">\n          <div style=\"flex:1;height:2px;background:rgba(var(--ink-rgb,32,30,29),.4)\"><\u002Fdiv>\n          <div style=\"flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">ou avec un code de session<\u002Fdiv>\n          <div style=\"flex:1;height:2px;background:rgba(var(--ink-rgb,32,30,29),.4)\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <form sc-camel-on-submit=\"{{ onJoin }}\" style=\"margin-top:18px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <input value=\"{{ joinCode }}\" sc-camel-on-input=\"{{ onJoinCode }}\" placeholder=\"Code de session\" style=\"flex:1 1 128px;min-width:0;padding:12px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-size:14px\">\n            <input value=\"{{ joinName }}\" sc-camel-on-input=\"{{ onJoinName }}\" placeholder=\"Prénom et nom\" style=\"flex:2 1 170px;min-width:0;padding:12px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-size:14px\">\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border:0;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2);font-size:14px;font-weight:800;text-align:left\">\n            Rejoindre l’atelier\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" style=\"margin-left:auto\"><line x1=\"4\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13,6 19,12 13,18\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fform>\n\n        <sc-if value=\"{{ joinErrOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:9px;padding:10px 12px;border:2px solid var(--acc,#ec3013);background:var(--tint,#ffe0d9);font-size:12px;font-weight:600;color:var(--acc-deep,#7c1000);text-wrap:pretty\">{{ joinErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(var(--ink-rgb,32,30,29),.25);font-size:11px;line-height:1.5;color:rgba(var(--ink-rgb,32,30,29),.58);text-wrap:pretty\">L’identité ne sert qu’à attribuer les contributions : aucun droit particulier n’en découle, le rôle est porté par la session. Codes de démonstration : DAB-914, AUT-929.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPicker }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Choix de session\" style=\"min-height:var(--ui-h,100vh);zoom:var(--ui-zoom,1);display:flex;flex-direction:column;background:var(--surf,#f3f2f2)\">\n    <header style=\"flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:11px 20px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n      <div style=\"width:26px;height:26px;background:var(--acc,#ec3013)\"><\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Assistant Event Storming<\u002Fdiv>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n        <div style=\"flex:none;width:30px;height:30px;display:grid;place-items:center;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2);font-size:11px;font-weight:800\">{{ account.initials }}<\u002Fdiv>\n        <div style=\"line-height:1.25\">\n          <div style=\"font-size:12px;font-weight:800\">{{ account.name }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ account.handle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"margin-left:6px;padding:7px 11px;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent;color:var(--ink,#201e1d);font-size:12px;font-weight:800\">Se déconnecter<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"flex:1;display:flex;flex-wrap:wrap;align-items:stretch;min-height:0\">\n      <div style=\"flex:1 1 640px;min-width:320px;padding:30px 26px;overflow:auto\">\n        <div style=\"display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 16px\">\n          <h1 style=\"font-size:34px\">Vos sessions<\u002Fh1>\n          <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.6)\">{{ sessionsMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <sc-for list=\"{{ sessionsList }}\" as=\"x\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ x.onClick }}\" style-hover=\"background:var(--surf2,#eae9e9)\" style=\"width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:15px 14px;text-align:left;border:0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2);border-left:4px solid {{ x.mark }};background:transparent;color:var(--ink,#201e1d)\">\n              <div style=\"flex:1 1 230px;min-width:0\">\n                <div style=\"font-size:15px;font-weight:800;line-height:1.25\">{{ x.label }}<\u002Fdiv>\n                <div style=\"font-size:11px;margin-top:3px;color:rgba(var(--ink-rgb,32,30,29),.6)\">{{ x.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;padding:4px 8px;border:1px solid {{ x.roleBorder }};background:{{ x.roleBg }};color:{{ x.roleInk }};font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\">{{ x.role }}<\u002Fdiv>\n              <div style=\"flex:none;width:142px;display:flex;align-items:center;gap:9px\">\n                <div style=\"flex:none;width:8px;height:8px;background:{{ x.dot }}\"><\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:12px;font-weight:800\">{{ x.state }}<\u002Fdiv>\n                  <div style=\"font-size:10px;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ x.stateHint }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;width:104px\">\n                <div style=\"height:6px;background:rgba(var(--ink-rgb,32,30,29),.18)\">\n                  <div style=\"height:6px;width:{{ x.pct }};background:{{ x.barBg }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:10px;margin-top:4px;letter-spacing:.05em;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ x.progress }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;display:flex;align-items:center;gap:9px;padding:9px 12px;background:{{ x.ctaBg }};color:{{ x.ctaInk }};font-size:12px;font-weight:800\">\n                {{ x.cta }}\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"4\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13,6 19,12 13,18\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 350px;min-width:300px;padding:30px 26px;background:var(--surf2,#eae9e9);border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4);border-left:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n        <h2 style=\"font-size:20px\">Créer une session<\u002Fh2>\n        <p style=\"margin-top:7px;font-size:12px;line-height:1.45;color:rgba(var(--ink-rgb,32,30,29),.65);text-wrap:pretty\">Vous en êtes le facilitateur. Le code est généré à la création, puis diffusé aux participants.<\u002Fp>\n        <form sc-camel-on-submit=\"{{ onCreate }}\" style=\"margin-top:18px;display:flex;flex-direction:column;gap:13px\">\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Intitulé<\u002Fspan>\n            <input value=\"{{ newName }}\" sc-camel-on-input=\"{{ onNewName }}\" placeholder=\"Résiliation — Big Picture\" style=\"width:100%;margin-top:5px;padding:11px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-size:13px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Domaine<\u002Fspan>\n            <input value=\"{{ newDomain }}\" sc-camel-on-input=\"{{ onNewDomain }}\" placeholder=\"Résiliation de contrat\" style=\"width:100%;margin-top:5px;padding:11px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-size:13px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Dates<\u002Fspan>\n            <input value=\"{{ newDates }}\" sc-camel-on-input=\"{{ onNewDates }}\" placeholder=\"6-7 oct. 2026\" style=\"width:100%;margin-top:5px;padding:11px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-size:13px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Déroulé<\u002Fspan>\n            <div style=\"position:relative;margin-top:5px\">\n              <sc-raw-select value=\"{{ newTpl }}\" sc-camel-on-change=\"{{ onNewTpl }}\" style=\"width:100%;appearance:none;-webkit-appearance:none;border-radius:0;padding:11px 40px 11px 11px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf,#f3f2f2);color:var(--ink,#201e1d);font-family:inherit;font-size:13px;font-weight:600;line-height:1.25\">\n                <option value=\"Big Picture 2 jours (Brandolini)\">Big Picture 2 jours (Brandolini)<\u002Foption>\n                <option value=\"Process Modelling 1 jour\">Process Modelling 1 jour<\u002Foption>\n                <option value=\"Design Level 1 jour\">Design Level 1 jour<\u002Foption>\n              <\u002Fsc-raw-select>\n              <div style=\"position:absolute;top:2px;right:2px;bottom:2px;width:34px;display:grid;place-items:center;pointer-events:none;border-left:2px solid rgba(var(--ink-rgb,32,30,29),.4);color:var(--ink,#201e1d)\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><polyline points=\"5,9 12,16 19,9\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Flabel>\n          <button type=\"submit\" style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2);font-size:14px;font-weight:800;text-align:left;opacity:{{ createOpacity }}\">\n            Créer et ouvrir\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" style=\"margin-left:auto\"><line x1=\"4\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13,6 19,12 13,18\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fform>\n        <div style=\"margin-top:20px;padding-top:14px;border-top:1px solid rgba(var(--ink-rgb,32,30,29),.25);font-size:11px;line-height:1.5;color:rgba(var(--ink-rgb,32,30,29),.58);text-wrap:pretty\">Une session porte son déroulé, ses participants et son export. Rien ne circule d’une session à l’autre.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"height:var(--ui-h,100vh);zoom:var(--ui-zoom,1);display:flex;flex-direction:column;overflow:hidden;background:var(--surf,#f3f2f2)\">\n\n  <header style=\"flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;padding:9px 16px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n      <div style=\"width:26px;height:26px;background:var(--acc,#ec3013)\"><\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.2\">Assistant Event Storming<\u002Fdiv>\n        <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55);line-height:1.2\">{{ sessionName }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 220px;min-width:160px\">\n      <div style=\"display:flex;gap:2px\">\n        <sc-for list=\"{{ rail }}\" as=\"p\" hint-placeholder-count=\"9\">\n          <div style=\"flex:1;height:7px;background:{{ p.barBg }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;margin-top:5px;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.6)\">\n        <span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ headerPhase }}<\u002Fspan>\n        <span style=\"flex:none;letter-spacing:.06em;text-transform:uppercase\">{{ progressLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;display:flex;align-items:center;gap:8px;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);padding:4px 4px 4px 10px\">\n      <div style=\"font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;letter-spacing:.02em;color:{{ timerInk }}\">{{ timer }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ onTimer }}\" title=\"Démarrer / suspendre\" style=\"width:30px;height:30px;display:grid;place-items:center;background:{{ timerBtnBg }};color:{{ timerBtnInk }};border:0\">\n        <sc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ false }}\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"4\" width=\"4\" height=\"16\"><\u002Frect><rect x=\"14\" y=\"4\" width=\"4\" height=\"16\"><\u002Frect><\u002Fsvg>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notRunning }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"6,4 20,12 6,20\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fsc-if>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ onTimerReset }}\" title=\"Remettre la durée de l’étape\" style=\"width:30px;height:30px;display:grid;place-items:center;background:transparent;border:0;color:rgba(var(--ink-rgb,32,30,29),.6)\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"><\u002Fpath><polyline points=\"3,3 3,9 9,9\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;display:flex;border:1px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n      <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <button type=\"button\" sc-camel-on-click=\"{{ v.onClick }}\" style=\"height:30px;padding:0 11px;font-size:12px;font-weight:800;line-height:1;letter-spacing:.02em;border:0;border-left:{{ v.sep }};background:{{ v.bg }};color:{{ v.ink }}\">{{ v.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;display:flex;align-items:center;gap:6px\">\n      <sc-if value=\"{{ railToggleOn }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onToggleRail }}\" title=\"Afficher ou masquer le déroulé\" style=\"width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:{{ railBtnBg }};color:{{ railBtnInk }}\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\"><\u002Frect><line x1=\"9\" y1=\"3\" x2=\"9\" y2=\"21\"><\u002Fline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <button type=\"button\" sc-camel-on-click=\"{{ onToggleAside }}\" title=\"Afficher ou masquer le panneau\" style=\"width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:{{ asideBtnBg }};color:{{ asideBtnInk }}\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\"><\u002Frect><line x1=\"15\" y1=\"3\" x2=\"15\" y2=\"21\"><\u002Fline><\u002Fsvg>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ onBackToSessions }}\" title=\"Revenir au choix de session\" style=\"display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;font-size:12px;font-weight:800;line-height:1;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent;color:var(--ink,#201e1d)\">\n        <div style=\"flex:none;width:18px;height:18px;display:grid;place-items:center;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2);font-size:9px;font-weight:800\">{{ account.initials }}<\u002Fdiv>\n        Sessions\n      <\u002Fbutton>\n      <sc-if value=\"{{ ghostEnabled }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onToggleGhosts }}\" style=\"display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;font-size:12px;font-weight:800;line-height:1;border:1px dashed rgba(var(--ink-rgb,32,30,29),.55);background:{{ ghostBtnBg }};color:{{ ghostBtnInk }}\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3a7 7 0 0 0-7 7v11l3-2 2 2 2-2 2 2 3 2V10a7 7 0 0 0-5-7z\"><\u002Fpath><\u002Fsvg>\n          {{ ghostBtnLabel }}\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <button type=\"button\" sc-camel-on-click=\"{{ onOpenExport }}\" style=\"display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;font-size:12px;font-weight:800;line-height:1;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"7,10 12,15 17,10\"><\u002Fpolyline><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"><\u002Fline><\u002Fsvg>\n        Export\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1;display:flex;min-height:0;overflow-x:auto\">\n\n    <sc-if value=\"{{ showRail }}\" hint-placeholder-val=\"{{ true }}\">\n      <nav style=\"flex:0 1 274px;min-width:196px;border-right:2px solid rgba(var(--ink-rgb,32,30,29),.4);overflow:auto;background:var(--surf,#f3f2f2)\">\n        <div style=\"padding:13px 12px 10px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Déroulé Brandolini<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55);margin-top:3px;line-height:1.35\">Chaque étape s’ouvre quand la précédente est validée.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div style=\"border-top:1px solid rgba(var(--ink-rgb,32,30,29),.25)\">\n              <sc-if value=\"{{ p.dayFirst }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:12px 12px 5px;border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">{{ p.day }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 12px;border:0;border-left:3px solid {{ p.mark }};background:{{ p.bg }};color:{{ p.ink }};opacity:{{ p.opacity }}\">\n                <div style=\"flex:none;width:16px;padding-top:1px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:{{ p.numInk }}\">{{ p.n }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13px;font-weight:800;line-height:1.2\">{{ p.title }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:{{ p.metaInk }};margin-top:2px\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.locked }}\" hint-placeholder-val=\"{{ false }}\">\n                  <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"flex:none;margin-top:3px;opacity:.5\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.done }}\" hint-placeholder-val=\"{{ false }}\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" style=\"flex:none;margin-top:3px\"><polyline points=\"4,13 9,18 20,6\"><\u002Fpolyline><\u002Fsvg>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding:13px 12px\">\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Indicateurs de séance<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:0;margin-top:8px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                <div style=\"flex:1;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.7);line-height:1.3\">{{ k.label }}<\u002Fdiv>\n                <div style=\"flex:none;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:{{ k.ink }}\">{{ k.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <main style=\"flex:1 1 auto;display:flex;flex-direction:column;min-width:392px;min-height:0\">\n\n      <div style=\"flex:none;display:flex;align-items:flex-start;flex-wrap:wrap;gap:14px 20px;padding:16px 22px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n        <div style=\"flex:1 1 300px;min-width:240px\">\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">{{ ph.kicker }}<\u002Fdiv>\n          <h2 style=\"font-size:27px;margin-top:4px\">{{ ph.title }}<\u002Fh2>\n          <div style=\"font-size:13px;color:rgba(var(--ink-rgb,32,30,29),.6);margin-top:5px;max-width:72ch;text-wrap:pretty\">{{ ph.aim }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;min-width:250px;max-width:320px;border-left:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding-left:16px\">\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Condition de passage<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;margin-top:5px;text-wrap:pretty\">{{ gateLabel }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;margin-top:7px\">\n            <div style=\"width:9px;height:9px;flex:none;background:{{ gateDot }}\"><\u002Fdiv>\n            <div style=\"font-size:12px;font-variant-numeric:tabular-nums;color:{{ gateInk }}\">{{ gateHint }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isFacilitateur }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onValidate }}\" disabled=\"{{ gateBlocked }}\" style=\"width:100%;margin-top:10px;display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:9px 12px;font-size:13px;font-weight:800;border:0;background:{{ validateBg }};color:{{ validateInk }};opacity:{{ validateOpacity }}\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><polyline points=\"4,13 9,18 20,6\"><\u002Fpolyline><\u002Fsvg>\n              {{ validateLabel }}\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notFacilitateur }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;padding:8px 10px;font-size:12px;background:var(--surf2,#eae9e9);color:rgba(var(--ink-rgb,32,30,29),.65)\">Le passage à l’étape suivante est tenu par le facilitateur.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow:auto;padding:20px 22px 40px\">\n\n        <sc-if value=\"{{ ghostStripOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"margin-bottom:20px;border:1px dashed rgba(var(--ink-rgb,32,30,29),.5);padding:12px 14px;background:rgba(var(--surf2-rgb,234,233,233),.6)\">\n            <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.6)\">Couche fantôme · transcription Teams<\u002Fdiv>\n              <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ ghostCountLabel }} — les propositions non adoptées disparaissent à la fin de l’étape.<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ onOpenImport }}\" style=\"margin-left:auto;padding:5px 9px;font-size:11px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent;color:var(--ink,#201e1d)\">Réimporter<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n              <sc-for list=\"{{ ghosts }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div style=\"width:236px;border:1px dashed {{ g.bg }};background:rgba(var(--surf-rgb,243,242,242),.75);animation:ghostpulse 4s ease-in-out infinite\">\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.6);border-bottom:1px dashed rgba(var(--ink-rgb,32,30,29),.35)\">\n                    <span>{{ g.typeLabel }}<\u002Fspan><span>{{ g.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:8px;font-size:12px;font-style:italic;line-height:1.3\">{{ g.text }}<\u002Fdiv>\n                  <div style=\"padding:0 8px 8px;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55);border-left:2px solid rgba(var(--ink-rgb,32,30,29),.3);margin:0 8px 8px\">{{ g.quote }} — {{ g.speaker }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:1px;border-top:1px dashed rgba(var(--ink-rgb,32,30,29),.35)\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ g.onAdopt }}\" style=\"flex:1;padding:6px;font-size:11px;font-weight:800;border:0;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2)\">Adopter<\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ g.onDrop }}\" style=\"flex:none;padding:6px 10px;font-size:11px;border:0;background:transparent;color:rgba(var(--ink-rgb,32,30,29),.6)\">Laisser périmer<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isP1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <section data-screen-label=\"01 Lancement et échauffement\" style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start\">\n            <div style=\"flex:1 1 380px;min-width:0\">\n              <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding-bottom:7px\">\n                <h4 style=\"font-size:15px\">Tour de table — 15 secondes par personne<\u002Fh4>\n                <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ rosterLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;background:rgba(var(--ink-rgb,32,30,29),.2);margin-top:14px\">\n                <sc-for list=\"{{ roster }}\" as=\"m\" hint-placeholder-count=\"12\">\n                  <div style=\"background:{{ m.bg }};padding:9px 10px;border-left:3px solid {{ m.mark }}\">\n                    <div style=\"display:flex;align-items:baseline;gap:6px\">\n                      <div style=\"flex:1;font-size:12px;font-weight:800;line-height:1.2\">{{ m.name }}<\u002Fdiv>\n                      <div style=\"flex:none;font-size:11px;font-variant-numeric:tabular-nums;color:{{ m.countInk }}\">{{ m.count }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55);margin-top:3px\">{{ m.role }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 320px;min-width:0;max-width:420px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n              <div style=\"padding:12px 14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--surf2,#eae9e9)\">\n                <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Échauffement · 15 min<\u002Fdiv>\n                <h4 style=\"font-size:16px;margin-top:4px\">Commander une pizza<\u002Fh4>\n                <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.6);margin-top:4px\">Dix événements sur un sujet sans enjeu. Objectif : que les 23 aient écrit une fois.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:12px 14px\">\n                <form sc-camel-on-submit=\"{{ onWarmupSubmit }}\" style=\"display:flex;gap:0\">\n                  <input value=\"{{ warmupText }}\" sc-camel-on-change=\"{{ onWarmupInput }}\" placeholder=\"La pizza a été commandée\" style=\"flex:1;min-width:0;min-height:36px;padding:6px 10px;font-size:13px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                  <button type=\"submit\" style=\"flex:none;width:38px;display:grid;place-items:center;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">\n                    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fform>\n                <div style=\"font-size:11px;margin-top:6px;color:{{ warmupWarnInk }}\">{{ warmupWarn }}<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                  <sc-for list=\"{{ warmup }}\" as=\"w\" hint-placeholder-count=\"5\">\n                    <div style=\"background:#eb9130;color:var(--ink,#201e1d);padding:6px 8px;font-size:11px;line-height:1.25;max-width:100%\">{{ w.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums\">{{ warmupCountLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isP2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <section data-screen-label=\"02 Exploration chaotique\">\n            <div style=\"display:flex;align-items:stretch;gap:0;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);margin-bottom:18px\">\n              <div style=\"flex:1;padding:12px 14px\">\n                <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Écriture silencieuse — micros coupés<\u002Fdiv>\n                <div style=\"font-size:13px;color:rgba(var(--ink-rgb,32,30,29),.7);margin-top:4px;max-width:70ch\">Tout ce qui arrive dans le domaine, du plus banal au plus rare. Au passé. Peu importe l’ordre, peu importe les doublons.<\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ onNoteSubmit }}\" style=\"display:flex;gap:0;margin-top:12px;max-width:640px\">\n                  <input value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraftInput }}\" placeholder=\"Le sinistre a été déclaré par l’assuré\" style=\"flex:1;min-width:0;min-height:40px;padding:8px 12px;font-size:14px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                  <button type=\"submit\" style=\"flex:none;padding:0 16px;font-size:13px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Poser<\u002Fbutton>\n                <\u002Fform>\n                <div style=\"display:flex;align-items:center;gap:8px;margin-top:7px;min-height:18px\">\n                  <sc-if value=\"{{ draftWarnOn }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--acc-d,#ae1800);background:var(--tint,#ffe0d9);padding:3px 8px\">\n                      <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"14\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"17\"><\u002Fline><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg>\n                      {{ draftWarn }}\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.5)\">L’écart est signalé, jamais bloqué.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;width:230px;border-left:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding:12px 14px;background:var(--surf2,#eae9e9)\">\n                <sc-for list=\"{{ chaosStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                    <div style=\"flex:1;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.65)\">{{ s.k }}<\u002Fdiv>\n                    <div style=\"flex:none;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums\">{{ s.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:12px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ onDedupe }}\" disabled=\"{{ dedupeDone }}\" style=\"width:100%;text-align:left;padding:7px 10px;font-size:12px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent;color:var(--ink,#201e1d);opacity:{{ dedupeOpacity }}\">{{ dedupeLabel }}<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onToggleTri }}\" style=\"width:100%;text-align:left;padding:7px 10px;font-size:12px;font-weight:800;border:0;background:{{ triBg }};color:{{ triInk }}\">{{ triLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ chaosMaskShown }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 14px;margin-bottom:16px;border:1px dashed rgba(var(--ink-rgb,32,30,29),.5);background:rgba(var(--surf2-rgb,234,233,233),.7)\">\n                <div style=\"flex:1 1 340px;min-width:0\">\n                  <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">{{ revealKicker }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:rgba(var(--ink-rgb,32,30,29),.7);margin-top:5px;max-width:74ch;line-height:1.45;text-wrap:pretty\">{{ revealText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ onToggleReveal }}\" style=\"flex:none;padding:10px 14px;font-size:12px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:{{ revealBg }};color:{{ revealInk }}\">{{ revealLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <sc-for list=\"{{ chaosWall }}\" as=\"n\" hint-placeholder-count=\"14\">\n                <div sc-camel-on-click=\"{{ n.onClick }}\" style=\"width:186px;background:{{ n.bg }};color:{{ n.ink }};outline:{{ n.outline }};outline-offset:2px;cursor:pointer;box-shadow:0 1px 2px rgba(45,43,43,.14)\">\n                  <div style=\"padding:9px 10px 8px;font-size:12px;font-weight:600;line-height:1.3\">{{ n.text }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;padding:0 10px 8px;font-size:10px;opacity:.75\">\n                    <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.author }}<\u002Fspan>\n                    <span>{{ n.dupLabel }}<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ n.onDelete }}\" title=\"Supprimer cette carte\" style=\"flex:none;width:18px;height:18px;display:grid;place-items:center;border:0;background:rgba(32,30,29,.14);color:inherit;font-size:10px;line-height:1\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ n.warnOn }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:5px;padding:4px 10px;font-size:10px;font-weight:600;background:rgba(var(--ink-rgb,32,30,29),.14);border-top:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                      <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" style=\"flex:none\"><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"14\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"17\"><\u002Fline><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg>\n                      {{ n.warnMsg }}\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ triOn }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid rgba(var(--ink-rgb,32,30,29),.25)\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ n.onVote }}\" style=\"padding:2px 8px;font-size:11px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.45);background:transparent;color:inherit\">+1<\u002Fbutton>\n                      <div style=\"font-size:11px;font-weight:800;font-variant-numeric:tabular-nums\">{{ n.votes }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isP3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <section data-screen-label=\"03 Mise en chronologie\">\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);margin-bottom:16px\">\n              <div style=\"font-size:12px;font-weight:800\">{{ selLabel }}<\u002Fdiv>\n              <div style=\"flex:1 1 320px;min-width:0;font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.6);text-wrap:pretty\">Sélectionnez un bloc dans la pile, puis posez-le dans un moment. Les moments ne sont pas donnés par l’outil : vous les nommez, les déplacez, les retirez au fil du récit.<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-d,#ae1800)\">{{ colCountLabel }}<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ onClearSel }}\" style=\"margin-left:auto;padding:6px 10px;font-size:11px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent\">Désélectionner<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:0;align-items:stretch;min-height:420px\">\n              <div style=\"flex:none;width:206px;border:2px solid var(--acc,#ec3013);padding:10px;background:rgba(255,242,239,.7)\">\n                <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d,#ae1800)\">À placer · {{ unplacedCount }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n                  <sc-for list=\"{{ pile }}\" as=\"n\" hint-placeholder-count=\"5\">\n                    <div sc-camel-on-click=\"{{ n.onClick }}\" style=\"background:{{ n.bg }};color:{{ n.ink }};outline:{{ n.outline }};outline-offset:2px;cursor:pointer\">\n                      <div style=\"padding:8px 9px;font-size:12px;font-weight:600;line-height:1.25\">{{ n.text }}<\u002Fdiv>\n                      <sc-if value=\"{{ n.warnOn }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"padding:3px 9px;font-size:10px;font-weight:600;background:rgba(var(--ink-rgb,32,30,29),.14)\">{{ n.warnMsg }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ pileEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.55)\">La pile est vide. La chronologie tient de bout en bout.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ onPark }}\" disabled=\"{{ noSel }}\" style=\"width:100%;margin-top:12px;text-align:left;padding:7px 9px;font-size:11px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent;opacity:{{ parkOpacity }}\">Mettre de côté (hors sujet)<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-cl
