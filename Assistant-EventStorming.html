)\">{{ cell.kindLabel }}<\u002Fdiv>\n                        <sc-if value=\"{{ cell.filled }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"margin-top:6px;background:{{ cell.bg }};color:{{ cell.ink }};padding:7px 8px;font-size:11px;font-weight:600;line-height:1.3\">{{ cell.text }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ cell.knownOn }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex;flex-wrap:wrap;gap:4px;margin-top:6px\">\n                            <sc-for list=\"{{ cell.known }}\" as=\"k\" hint-placeholder-count=\"2\">\n                              <button type=\"button\" sc-camel-on-click=\"{{ k.onClick }}\" title=\"Réutiliser un élément déjà déclaré\" style=\"border:1px solid {{ cell.bg }};background:transparent;color:var(--ink,#201e1d);padding:3px 7px;font-size:10px;font-weight:700;text-align:left\">{{ k.text }}<\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ cell.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ cell.onAdd }}\" style=\"width:100%;margin-top:6px;text-align:left;padding:7px 8px;font-size:11px;font-weight:800;border:1px dashed rgba(var(--ink-rgb,32,30,29),.45);background:transparent;color:rgba(var(--ink-rgb,32,30,29),.55)\">+ {{ cell.kindLabel }}<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ ch.inlineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                    <form sc-camel-on-submit=\"{{ onInlineSubmit }}\" style=\"display:flex;gap:0;padding:8px;background:var(--surf2,#eae9e9)\">\n                      <input value=\"{{ inlineText }}\" sc-camel-on-change=\"{{ onInlineInput }}\" placeholder=\"{{ inlinePlaceholder }}\" style=\"flex:1;min-height:36px;padding:6px 10px;font-size:13px;background:var(--surf,#f3f2f2);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                      <button type=\"submit\" style=\"flex:none;padding:0 14px;font-size:12px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Poser<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ onInlineCancel }}\" style=\"flex:none;padding:0 11px;font-size:12px;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-left:0;background:transparent\">✕<\u002Fbutton>\n                    <\u002Fform>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv><\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isP8 }}\" hint-placeholder-val=\"{{ false }}\">\n          <section data-screen-label=\"08 Chemins alternatifs et clôture\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start\">\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding-bottom:6px\">\n                <h4 style=\"font-size:15px\">Points chauds ouverts<\u002Fh4>\n                <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Ne cherchez pas l’exhaustivité — deux ou trois variantes qui comptent.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px\">\n                <sc-for list=\"{{ hotspots }}\" as=\"h\" hint-placeholder-count=\"3\">\n                  <div style=\"border-left:4px solid var(--acc,#ec3013);background:var(--surf2,#eae9e9);padding:10px 12px\">\n                    <div style=\"font-size:12px;font-weight:600;line-height:1.3\">{{ h.text }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:10px;margin-top:8px\">\n                      <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">{{ h.col }}<\u002Fdiv>\n                      <button type=\"button\" sc-camel-on-click=\"{{ h.onDeroule }}\" style=\"margin-left:auto;padding:5px 10px;font-size:11px;font-weight:800;border:0;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2)\">Dérouler la variante<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ h.inlineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <form sc-camel-on-submit=\"{{ onInlineSubmit }}\" style=\"display:flex;gap:0;margin-top:8px\">\n                        <input value=\"{{ inlineText }}\" sc-camel-on-change=\"{{ onInlineInput }}\" placeholder=\"{{ inlinePlaceholder }}\" style=\"flex:1;min-height:34px;padding:6px 9px;font-size:12px;background:var(--surf,#f3f2f2);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                        <button type=\"submit\" style=\"flex:none;padding:0 12px;font-size:11px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Créer<\u002Fbutton>\n                      <\u002Fform>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding-bottom:6px\">\n                <h4 style=\"font-size:15px\">Variantes déroulées<\u002Fh4>\n                <div style=\"font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto\">{{ altCountLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n                <sc-for list=\"{{ alts }}\" as=\"a\" hint-placeholder-count=\"2\">\n                  <div style=\"border:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n                    <div style=\"padding:8px 10px;background:var(--surf2,#eae9e9);border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.25);font-size:12px;font-weight:800\">{{ a.title }}<\u002Fdiv>\n                    <div style=\"padding:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                      <div style=\"background:var(--acc,#ec3013);color:var(--paper,#f3f2f2);padding:6px 9px;font-size:11px;font-weight:600\">{{ a.origin }}<\u002Fdiv>\n                      <svg width=\"18\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(var(--ink-rgb,32,30,29),.45)\" stroke-width=\"2.5\"><line x1=\"3\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"14,7 19,12 14,17\"><\u002Fpolyline><\u002Fsvg>\n                      <div style=\"background:#eb9130;color:var(--ink,#201e1d);padding:6px 9px;font-size:11px;font-weight:600\">{{ a.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ noAlts }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"padding:16px;border:1px dashed rgba(var(--ink-rgb,32,30,29),.45);font-size:13px;color:rgba(var(--ink-rgb,32,30,29),.6)\">Reprenez les points chauds les plus importants et déroulez-les.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px;border:2px solid var(--acc,#ec3013);padding:12px\">\n                <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d,#ae1800)\">Clôture<\u002Fdiv>\n                <div style=\"font-size:13px;margin-top:6px;text-wrap:pretty\">« Ce mur est le vôtre. Il représente ce que vous avez dit, pas ce que quelqu’un a supposé. Ce qui reste en rouge, ce sont nos prochains sujets. »<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isP9 }}\" hint-placeholder-val=\"{{ false }}\">\n          <section data-screen-label=\"09 Découpage — aggregates et bounded contexts\">\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4);margin-bottom:16px\">\n              <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.65);max-width:62ch\">L’outil ne propose aucun découpage. Vous entourez une zone du mur, il mesure. {{ selLabel }}<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ onNewContext }}\" style=\"margin-left:auto;padding:7px 11px;font-size:12px;font-weight:800;border:0;background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2)\">+ Nouvelle frontière<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onOpenExport }}\" style=\"padding:7px 11px;font-size:12px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent\">Export markdown<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ ctxInlineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <form sc-camel-on-submit=\"{{ onInlineSubmit }}\" style=\"display:flex;gap:0;max-width:460px;margin-bottom:16px\">\n                <input value=\"{{ inlineText }}\" sc-camel-on-change=\"{{ onInlineInput }}\" placeholder=\"{{ inlinePlaceholder }}\" style=\"flex:1;min-height:38px;padding:7px 10px;font-size:13px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                <button type=\"submit\" style=\"flex:none;padding:0 14px;font-size:12px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Délimiter<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onInlineCancel }}\" style=\"flex:none;padding:0 11px;font-size:12px;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-left:0;background:transparent\">✕<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n              <div style=\"flex:1 1 480px;min-width:0\">\n                <div style=\"border:2px solid var(--acc,#ec3013);padding:10px;margin-bottom:16px\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px\">\n                    <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d,#ae1800)\">Hors frontière · {{ freeCount }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Cliquez un événement, puis une frontière.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                    <sc-for list=\"{{ freeEvents }}\" as=\"n\" hint-placeholder-count=\"10\">\n                      <div sc-camel-on-click=\"{{ n.onClick }}\" style=\"background:{{ n.bg }};color:{{ n.ink }};padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:{{ n.outline }};outline-offset:2px\">{{ n.text }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ freeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Tous les événements sont dans une frontière.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:14px\">\n                  <sc-for list=\"{{ contexts }}\" as=\"ctx\" hint-placeholder-count=\"2\">\n                    <div style=\"border:2px solid rgba(var(--ink-rgb,32,30,29),.55)\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ ctx.onAssign }}\" style=\"width:100%;text-align:left;display:flex;align-items:baseline;gap:12px;padding:10px 12px;border:0;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:{{ ctx.headBg }};color:{{ ctx.headInk }}\">\n                        <div style=\"font-size:15px;font-weight:800\">{{ ctx.name }}<\u002Fdiv>\n                        <div style=\"font-size:11px;opacity:.75\">{{ ctx.assignLabel }}<\u002Fdiv>\n                        <div style=\"margin-left:auto;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums\">{{ ctx.metaLabel }}<\u002Fdiv>\n                      <\u002Fbutton>\n                      <div style=\"padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ ctx.events }}\" as=\"n\" hint-placeholder-count=\"4\">\n                          <div sc-camel-on-click=\"{{ n.onClick }}\" style=\"background:{{ n.bg }};color:{{ n.ink }};padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:{{ n.outline }};outline-offset:2px\">{{ n.text }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-if value=\"{{ ctx.empty }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.5)\">Frontière vide — sélectionnez des événements et cliquez l’en-tête.<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;gap:1px;background:rgba(var(--ink-rgb,32,30,29),.2);border-top:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                        <div style=\"flex:1;background:var(--surf,#f3f2f2);padding:9px 12px\">\n                          <div style=\"font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.45)\">Aggregates<\u002Fdiv>\n                          <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:6px\">\n                            <sc-for list=\"{{ ctx.aggregates }}\" as=\"a\" hint-placeholder-count=\"1\">\n                              <div style=\"border:2px solid var(--ink,#201e1d);padding:4px 8px;font-size:11px;font-weight:800\">{{ a.name }}<\u002Fdiv>\n                            <\u002Fsc-for>\n                            <button type=\"button\" sc-camel-on-click=\"{{ ctx.onAddAggregate }}\" style=\"padding:4px 8px;font-size:11px;font-weight:800;border:1px dashed rgba(var(--ink-rgb,32,30,29),.45);background:transparent;color:rgba(var(--ink-rgb,32,30,29),.6)\">+ Aggregate<\u002Fbutton>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ ctx.inlineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                            <form sc-camel-on-submit=\"{{ onInlineSubmit }}\" style=\"display:flex;gap:0;margin-top:8px;max-width:320px\">\n                              <input value=\"{{ inlineText }}\" sc-camel-on-change=\"{{ onInlineInput }}\" placeholder=\"{{ inlinePlaceholder }}\" style=\"flex:1;min-height:32px;padding:5px 8px;font-size:12px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                              <button type=\"submit\" style=\"flex:none;padding:0 11px;font-size:11px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Poser<\u002Fbutton>\n                            <\u002Fform>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"flex:none;width:190px;background:var(--surf2,#eae9e9);padding:9px 12px\">\n                          <div style=\"font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.45)\">Mesures<\u002Fdiv>\n                          <sc-for list=\"{{ ctx.measures }}\" as=\"m\" hint-placeholder-count=\"3\">\n                            <div style=\"display:flex;align-items:baseline;gap:8px;padding:3px 0\">\n                              <div style=\"flex:1;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.65)\">{{ m.k }}<\u002Fdiv>\n                              <div style=\"flex:none;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:{{ m.ink }}\">{{ m.v }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ noContexts }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"padding:18px;border:1px dashed rgba(var(--ink-rgb,32,30,29),.45);font-size:13px;color:rgba(var(--ink-rgb,32,30,29),.6);max-width:64ch;text-wrap:pretty\">Aucune frontière posée. Créez-en une, nommez-la dans le langage du métier, puis affectez les événements. Les mesures se recalculent à chaque affectation.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:22px\">\n                  <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);padding-bottom:6px\">\n                    <h4 style=\"font-size:15px\">Vertical slices dérivées<\u002Fh4>\n                    <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Une commande, son événement, sa frontière.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px;margin-top:8px\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55);padding:7px 8px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">Slice<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55);padding:7px 8px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">Événement produit<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55);padding:7px 8px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">Frontière<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55);padding:7px 8px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">Acteur<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n                    <sc-raw-tbody>\n                      <sc-for list=\"{{ slices }}\" as=\"s\" hint-placeholder-count=\"5\">\n                        <sc-raw-tr>\n                          <sc-raw-td style=\"padding:7px 8px;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2);font-weight:600\">{{ s.cmd }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding:7px 8px;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">{{ s.out }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding:7px 8px;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2);color:{{ s.ctxInk }}\">{{ s.ctx }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding:7px 8px;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2);color:rgba(var(--ink-rgb,32,30,29),.6)\">{{ s.actor }}<\u002Fsc-raw-td>\n                        <\u002Fsc-raw-tr>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 280px;min-width:0;max-width:340px;border:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n                <div style=\"padding:10px 12px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2)\">\n                  <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase\">Mesures du mur<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:10px 12px\">\n                  <sc-for list=\"{{ globalMeasures }}\" as=\"m\" hint-placeholder-count=\"5\">\n                    <div style=\"padding:8px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                      <div style=\"display:flex;align-items:baseline;gap:8px\">\n                        <div style=\"flex:1;font-size:12px;font-weight:600\">{{ m.k }}<\u002Fdiv>\n                        <div style=\"flex:none;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:{{ m.ink }}\">{{ m.v }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55);margin-top:2px;text-wrap:pretty\">{{ m.hint }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:10px 12px;border-top:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                  <div style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Liens traversants<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:8px\">\n                    <sc-for list=\"{{ crossings }}\" as=\"x\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size:11px;line-height:1.3;border-left:3px solid var(--acc,#ec3013);padding-left:7px\">\n                        <div style=\"font-weight:600\">{{ x.from }}<\u002Fdiv>\n                        <div style=\"color:rgba(var(--ink-rgb,32,30,29),.55)\">→ {{ x.to }}<\u002Fdiv>\n                        <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-d,#ae1800);margin-top:2px\">{{ x.pair }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ noCrossings }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Aucun lien ne franchit une frontière pour l’instant.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ showAside }}\" hint-placeholder-val=\"{{ true }}\">\n    <aside style=\"flex:0 1 336px;min-width:252px;border-left:2px solid rgba(var(--ink-rgb,32,30,29),.4);overflow:auto;background:var(--surf,#f3f2f2)\">\n\n      <sc-if value=\"{{ isFacilitateur }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Ce que vous dites pour lancer<\u002Fdiv>\n            <div style=\"margin-top:8px;border-left:3px solid var(--ink,#201e1d);padding-left:10px;font-size:13px;line-height:1.45;text-wrap:pretty\">{{ ph.launch }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Pièges de cette étape<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;margin-top:6px\">\n              <sc-for list=\"{{ ph.pieges }}\" as=\"pi\" hint-placeholder-count=\"3\">\n                <div style=\"padding:9px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                  <div style=\"font-size:12px;font-weight:800;line-height:1.25\">{{ pi.p }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.65);margin-top:3px;line-height:1.35\">{{ pi.r }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Aller chercher les silencieux<\u002Fdiv>\n              <div style=\"margin-left:auto;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums\">{{ silentCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:9px\">\n              <sc-for list=\"{{ silents }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;background:{{ s.bg }}\">\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:12px;font-weight:800\">{{ s.name }}<\u002Fdiv>\n                    <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">{{ s.role }} · {{ s.since }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ s.onNudge }}\" style=\"flex:none;padding:5px 9px;font-size:11px;font-weight:800;border:0;background:{{ s.btnBg }};color:{{ s.btnInk }}\">{{ s.btnLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noSilents }}\" hint-placeholder-val=\"{{ false }}\">\n u002Fdiv>\n                <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Mes éléments<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:var(--surf2,#eae9e9);padding:9px 10px\">\n                <div style=\"font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc,#ec3013)\">{{ votesLeft }}<\u002Fdiv>\n                <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.55)\">Voix restantes<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Consigne en cours<\u002Fdiv>\n            <div style=\"font-size:13px;margin-top:7px;line-height:1.45;text-wrap:pretty\">{{ ph.consigne }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:10px;padding:8px 10px;background:var(--tint,#ffe0d9)\">\n              <div style=\"font-size:11px;font-weight:800;color:var(--acc-d,#ae1800)\">{{ timer }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--acc-deep,#7c1405)\">avant la fin de l’étape<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Légende de notation<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:1px;margin-top:8px;background:rgba(var(--ink-rgb,32,30,29),.2)\">\n              <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;gap:9px;background:var(--surf,#f3f2f2);padding:7px 4px\">\n                  <div style=\"flex:none;width:18px;height:18px;background:{{ l.bg }}\"><\u002Fdiv>\n                  <div style=\"flex:none;width:88px;font-size:12px;font-weight:800\">{{ l.label }}<\u002Fdiv>\n                  <div style=\"flex:1;font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.6)\">{{ l.hint }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isArchitecte }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4);background:var(--ink,#201e1d);color:var(--on-ink,#f3f2f2)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase\">Instrument, pas verdict<\u002Fdiv>\n            <div style=\"font-size:12px;margin-top:6px;opacity:.85;text-wrap:pretty\">Les mesures sont déterministes et calculées sur le graphe. Aucun découpage n’est proposé.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#ec3013)\">Mesures en direct<\u002Fdiv>\n            <div style=\"margin-top:8px\">\n              <sc-for list=\"{{ globalMeasures }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                  <div style=\"flex:1;font-size:12px\">{{ m.k }}<\u002Fdiv>\n                  <div style=\"flex:none;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:{{ m.ink }}\">{{ m.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Langage pivot<\u002Fdiv>\n              <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:{{ termsTodoInk }}\">{{ termsTodo }}<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ onAddTerm }}\" style=\"margin-left:auto;padding:4px 8px;font-size:11px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent\">+ Terme<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ termInlineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <form sc-camel-on-submit=\"{{ onInlineSubmit }}\" style=\"display:flex;gap:0;margin-top:8px\">\n                <input value=\"{{ inlineText }}\" sc-camel-on-change=\"{{ onInlineInput }}\" placeholder=\"{{ inlinePlaceholder }}\" style=\"flex:1;min-width:0;min-height:32px;padding:5px 8px;font-size:12px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                <button type=\"submit\" style=\"flex:none;padding:0 10px;font-size:11px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Poser<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;margin-top:8px\">\n              <sc-for list=\"{{ terms }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"padding:8px 0;border-bottom:1px solid rgba(var(--ink-rgb,32,30,29),.2)\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px\">\n                    <div style=\"font-size:12px;font-weight:800\">{{ t.term }}<\u002Fdiv>\n                    <div style=\"margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:{{ t.tagInk }}\">{{ t.tag }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px;color:{{ t.defInk }};margin-top:2px;line-height:1.35\">{{ t.def }}<\u002Fdiv>\n                  <sc-if value=\"{{ t.byOn }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:10px;margin-top:2px;color:rgba(var(--ink-rgb,32,30,29),.45)\">{{ t.by }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ t.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <form sc-camel-on-submit=\"{{ t.onSubmit }}\" style=\"display:flex;gap:0;margin-top:6px\">\n                      <input value=\"{{ t.text }}\" sc-camel-on-change=\"{{ onTermInput }}\" placeholder=\"La définition dite par le métier\" style=\"flex:1;min-width:0;min-height:30px;padding:5px 8px;font-size:11px;background:var(--surf2,#eae9e9);border:1px solid rgba(var(--ink-rgb,32,30,29),.4);border-right:0;color:var(--ink,#201e1d)\">\n                      <button type=\"submit\" style=\"flex:none;padding:0 9px;font-size:11px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Retenir<\u002Fbutton>\n                    <\u002Fform>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ t.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.onEdit }}\" style=\"margin-top:5px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.04em;border:1px solid {{ t.ctaBorder }};background:transparent;color:{{ t.ctaInk }}\">{{ t.cta }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb,32,30,29),.5)\">Événements orphelins<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:8px\">\n              <sc-for list=\"{{ orphans }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:11px;line-height:1.3;padding:6px 8px;background:var(--surf2,#eae9e9);border-left:3px solid var(--acc,#ec3013)\">\n                  <div style=\"font-weight:600\">{{ o.text }}<\u002Fdiv>\n                  <div style=\"color:rgba(var(--ink-rgb,32,30,29),.55);margin-top:2px\">{{ o.why }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noOrphans }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.55)\">Aucun événement orphelin.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Faside>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ importOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:rgba(45,43,43,.5);z-index:40\">\n      <div style=\"width:min(560px,100%);background:var(--surf2,#eae9e9);box-shadow:0 12px 32px rgba(45,43,43,.22);border:2px solid rgba(var(--ink-rgb,32,30,29),.55)\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <div style=\"font-size:19px;font-weight:800\">Importer la transcription Teams<\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseImport }}\" style=\"margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;font-size:15px\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:16px\">\n          <div style=\"border:1px dashed rgba(var(--ink-rgb,32,30,29),.5);padding:22px;text-align:left;background:var(--surf,#f3f2f2)\">\n            <div style=\"font-size:13px;font-weight:800\">jour1-dommage-aux-biens.vtt<\u002Fdiv>\n            <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.6);margin-top:3px\">04 h 12 · 23 locuteurs identifiés · horodatée<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:rgba(var(--ink-rgb,32,30,29),.65);margin-top:12px;text-wrap:pretty\">Les propositions arrivent dans une couche visuellement distincte. Celles qui ne sont pas adoptées disparaissent à la fin de l’étape — l’inaction suffit à les supprimer. Chaque élément adopté reste rattaché à son extrait de conversation.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-top:16px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onImport }}\" style=\"padding:10px 14px;font-size:13px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">Analyser et proposer<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onCloseImport }}\" style=\"padding:10px 14px;font-size:13px;font-weight:800;border:1px solid rgba(var(--ink-rgb,32,30,29),.4);background:transparent\">Annuler<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ exportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:rgba(45,43,43,.5);z-index:40\">\n      <div style=\"width:min(880px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--surf2,#eae9e9);border:2px solid rgba(var(--ink-rgb,32,30,29),.55);box-shadow:0 12px 32px rgba(45,43,43,.22)\">\n        <div style=\"flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <div>\n            <div style=\"font-size:19px;font-weight:800\">Export markdown versionné<\u002Fdiv>\n            <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.6);margin-top:2px\">docs/event-storming/2026-09-16-dommage-aux-biens.md<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseExport }}\" style=\"margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;font-size:15px\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <pre style=\"flex:1;overflow:auto;margin:0;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;background:var(--surf,#f3f2f2);white-space:pre-wrap\">{{ markdown }}<\u002Fpre>\n        <div style=\"flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:2px solid rgba(var(--ink-rgb,32,30,29),.4)\">\n          <div style=\"font-size:11px;color:rgba(var(--ink-rgb,32,30,29),.6)\">{{ exportMeta }}<\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCommit }}\" style=\"margin-left:auto;padding:9px 13px;font-size:13px;font-weight:800;border:0;background:var(--acc,#ec3013);color:var(--paper,#f3f2f2)\">{{ commitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;ambiance&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Atelier clair&quot;, &quot;Papier kraft&quot;, &quot;Mur sombre&quot;], &quot;default&quot;: &quot;Atelier clair&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Atmosphère&quot; },\n  &quot;nuancier&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Event Storming&quot;, &quot;Sourdine&quot;, &quot;Projection&quot;], &quot;default&quot;: &quot;Event Storming&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Atmosphère&quot; },\n  &quot;echelle&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Poste de travail&quot;, &quot;Standard&quot;, &quot;Mur projeté&quot;], &quot;default&quot;: &quot;Standard&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Atmosphère&quot; },\n  &quot;entree&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Connexion&quot;, &quot;Choix de session&quot;, &quot;Atelier&quot;], &quot;default&quot;: &quot;Connexion&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Accès&quot; },\n  &quot;fournisseurId&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;GitHub&quot;, &quot;SSO (OIDC)&quot;], &quot;default&quot;: &quot;GitHub&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Accès&quot; },\n  &quot;sessionName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Dommage aux biens — cadrage · 15-16 sept. 2026&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Séance&quot; },\n  &quot;startAt&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Lancement (J1)&quot;, &quot;Exploration (J1)&quot;, &quot;Process (J2)&quot;, &quot;Découpage&quot;], &quot;default&quot;: &quot;Exploration (J1)&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Séance&quot; },\n  &quot;defaultView&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Facilitateur&quot;, &quot;Participant&quot;, &quot;Architecte&quot;], &quot;default&quot;: &quot;Facilitateur&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Séance&quot; },\n  &quot;strictGating&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Méthode&quot; },\n  &quot;grammarBadges&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Méthode&quot; },\n  &quot;ghostLayer&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Méthode&quot; }\n}\">\nclass Component extends DCLogic {\n  BASE_TYPES = {\n    event: { label: 'Événement', bg: '#eb9130', ink: '#201e1d', hint: 'Au passé' },\n    command: { label: 'Commande', bg: '#6f9fd8', ink: '#141b24', hint: 'À l’infinitif' },\n    actor: { label: 'Acteur', bg: '#f0d24a', ink: '#201e1d', hint: 'Un rôle, pas un nom' },\n    rule: { label: 'Règle', bg: '#b79cd8', ink: '#1c1622', hint: 'Dès que … alors …' },\n    info: { label: 'Information', bg: '#94c894', ink: '#16211a', hint: 'Ce qu’il faut voir pour décider' },\n    system: { label: 'Système', bg: '#eda6b7', ink: '#231518', hint: 'Une boîte noire' },\n    hotspot: { label: 'Point chaud', bg: '#ec3013', ink: '#f8f4f4', hint: 'Un désaccord, une question' },\n    opportunity: { label: 'Opportunité', bg: '#2f8d5b', ink: '#f4faf6', hint: 'Une amélioration entrevue' }\n  };\n\n  NUANCIERS = {\n    'Sourdine': {\n      event: { bg: '#d8b48d', ink: '#241a10' }, command: { bg: '#a9bccf', ink: '#141b24' },\n      actor: { bg: '#dbd2a4', ink: '#241f10' }, rule: { bg: '#c2b7cd', ink: '#1c1622' },\n      info: { bg: '#b2c8b2', ink: '#16211a' }, system: { bg: '#d5bcc1', ink: '#231518' },\n      hotspot: { bg: '#c25543', ink: '#fdf1ef' }, opportunity: { bg: '#6f9b81', ink: '#f2faf5' }\n    },\n    'Projection': {\n      event: { bg: '#ff8a00', ink: '#1a1200' }, command: { bg: '#1f6fd0', ink: '#f2f7ff' },\n      actor: { bg: '#ffd400', ink: '#1a1600' }, rule: { bg: '#8a5cd8', ink: '#fbf7ff' },\n      info: { bg: '#1f9d55', ink: '#f2fff8' }, system: { bg: '#e0648a', ink: '#1f0f14' },\n      hotspot: { bg: '#e0140a', ink: '#fff8f6' }, opportunity: { bg: '#0d7a4a', ink: '#eafff4' }\n    }\n  };\n\n  get TYPES() {\n    const n = this.NUANCIERS[this.props && this.props.nuancier];\n    if (!n) return this.BASE_TYPES;\n    const out = {};\n    for (const k in this.BASE_TYPES) out[k] = Object.assign({}, this.BASE_TYPES[k], n[k] || {});\n    return out;\n  }\n\n  COLS_SEED = [\n    { id: 'c1', label: 'Avant sinistre' },\n    { id: 'c2', label: 'Déclaration' },\n    { id: 'c3', label: 'Instruction' },\n    { id: 'c4', label: 'Expertise' },\n    { id: 'c5', label: 'Indemnisation' },\n    { id: 'c6', label: 'Clôture' }\n  ];\n\n  get COLS() { return (this.state && this.state.cols) || this.COLS_SEED; }\n\n  PHASES = [\n    { n: 1, day: 'Jour 1 — Comprendre le domaine', title: 'Lancement et échauffement', min: 45,\n      aim: 'Tout le monde a compris ce qu’est un événement, et tout le monde en a écrit un.',\n      launch: '« Pendant deux jours, on va reconstituer ensemble ce qui se passe réellement dans le domaine dommage aux biens. On ne parle pas de solution. La règle principale : si vous n’êtes pas d’accord, dites-le. »',\n      consigne: 'Tour de table de 15 secondes, puis dix événements sur la commande d’une pizza.',\n      pieges: [\n        { p: 'La tentation de sauter l’échauffement', r: 'C’est le meilleur investissement de la journée : il transforme 23 spectateurs en 23 contributeurs.' },\n        { p: 'Le tour de table dérape', r: 'Chronométrez. Quinze secondes par personne, prénom, rôle, une phrase.' }\n      ] },\n    { n: 2, day: 'Jour 1 — Comprendre le domaine', title: 'Exploration chaotique', min: 60,\n      aim: 'Entre 80 et 200 événements en vrac. Le désordre est normal et attendu.',\n      launch: '« Pendant 15 minutes, personne ne parle. Chacun écrit tout ce qui arrive dans le domaine. Formulez au passé : le sinistre a été déclaré, l’expert a été mandaté. Peu importe l’ordre, peu importe les doublons. Écrivez. »',\n      consigne: 'Écriture silencieuse, micros coupés. Formulez au passé. Les doublons ne sont pas un problème.',\n      pieges: [\n        { p: 'Quelqu’un veut discuter pendant l’écriture', r: '« On écrit d’abord, on discute après. »' },\n        { p: 'Les événements sont trop généraux', r: '« Qu’est-ce qui se passe précisément à ce moment-là ? »' },\n        { p: 'Un expert métier n’a rien écrit', r: 'Allez le chercher nominativement, en message privé si besoin.' }\n      ] },\n    { n: 3, day: 'Jour 1 — Comprendre le domaine', title: 'Mise en chronologie', min: 90,\n      aim: 'Une chronologie lisible de bout en bout, avec ses trous et ses points chauds.',\n      launch: '« On remet tout ça dans l’ordre du temps. Ce qui arrive en premier à gauche. Je déplace, vous me dites où. Si deux personnes ne sont pas d’accord, on marque un point chaud et on avance. »',\n      consigne: 'Le facilitateur déplace. Dites-lui où va chaque bloc.',\n      pieges: [\n        { p: 'Le groupe débat de l’ordre pendant dix minutes', r: '« Point chaud. On y reviendra. Suivant. »' },\n        { p: 'Quelqu’un propose une solution technique', r: '« Note-la de côté, on n’en est pas là. »' },\n        { p: 'Trois personnes parlent, vingt se taisent', r: '« Sur ce point, j’aimerais entendre quelqu’un de la gestion sinistre. »' }\n      ] },\n    { n: 4, day: 'Jour 1 — Comprendre le domaine', title: 'Le récit', min: 60,\n      aim: 'Une chronologie que le groupe reconnaît — deux narrateurs, et les écarts entre leurs récits.',\n      launch: '« Quelqu’un va nous raconter toute l’histoire, du début à la fin, en suivant le mur. Les autres écoutent et interrompent dès que quelque chose cloche ou manque. »',\n      consigne: 'Écoutez le narrateur et interrompez dès que quelque chose cloche ou manque.',\n      pieges: [\n        { p: 'Un développeur ou un consultant se propose', r: 'Désignez un expert métier. C’est sa connaissance qu’on cherche.' },\n        { p: 'Les deux récits divergent', r: 'Arrêtez-vous. C’est exactement pour ça que vous êtes là.' }\n      ] },\n    { n: 5, day: 'Jour 1 — Comprendre le domaine', title: 'Acteurs, systèmes et points chauds', min: 75,\n      aim: 'Une vue complète : ce qui se passe, qui le fait, avec quels outils, et où ça fait mal.',\n      launch: '« On ajoute trois choses : qui fait quoi, quels systèmes interviennent, et où ça coince aujourd’hui. »',\n      consigne: 'Pour chaque moment : qui a provoqué l’événement, quel outil intervient, où ça coince.',\n      pieges: [\n        { p: 'On explique comment marche un système', r: 'Traitez chaque système comme une boîte noire.' },\n        { p: 'Personne ne signale de point chaud', r: '« Qu’est-ce qui vous fait perdre du temps là-dedans ? »' }\n      ] },\n    { n: 6, day: 'Jour 2 — Dérouler les processus', title: 'Processus et commandes', min: 90,\n      aim: 'Deux ou trois processus retenus, et la commande qui déclenche chaque événement.',\n      launch: '« Hier on a vu ce qui arrive. Aujourd’hui, ce qui le déclenche. Devant chaque événement, il y a une action que quelqu’un a décidée : le sinistre a été déclaré est précédé de déclarer un sinistre. »',\n      consigne: 'L’événement est au passé, l’action est à l’infinitif.',\n      pieges: [\n        { p: '« Mais c’est la même chose que l’événement ! »', r: 'C’est normal et voulu. La commande deviendra une fonctionnalité du futur système.' },\n        { p: 'Le groupe veut détailler tous les processus', r: '« On en prend trois. Les autres attendront une prochaine séance. »' }\n      ] },\n    { n: 7, day: 'Jour 2 — Dérouler les processus', title: 'Règles, informations et systèmes', min: 120,\n      aim: 'Les processus retenus entièrement déroulés, règles métier explicites. C’est le livrable principal des deux jours.',\n      launch: '« Entre un événement et l’action qui suit, il y a toujours une règle. Dès qu’un sinistre dépasse un certain montant, alors on mandate un expert. C’est cette règle qu’on va faire apparaître. »',\n      consigne: 'Formulez toujours en « dès que … alors … ».',\n      pieges: [\n        { p: 'La règle reste implicite', r: 'Demandez le seuil, la condition, le délai. Une règle sans condition n’est pas une règle.' },\n        { p: 'On oublie l’information nécessaire', r: '« De quoi la personne a-t-elle besoin sous les yeux pour décider ? »' }\n      ] },\n    { n: 8, day: 'Jour 2 — Dérouler les processus', title: 'Chemins alternatifs et clôture', min: 90,\n      aim: 'Les variantes qui comptent, et la liste des points chauds restants.',\n      launch: '« On a déroulé le chemin normal. Maintenant : qu’est-ce qui se passe quand ça ne se passe pas comme prévu ? »',\n      consigne: 'Deux ou trois variantes seulement. On ne cherche pas l’exhaustivité.',\n      pieges: [\n        { p: 'La chasse à l’exhaustivité', r: 'Deux ou trois variantes, celles qui comptent. Le reste ira dans les prochaines séances.' },\n        { p: 'La clôture est expédiée', r: 'Chacun dit en une phrase ce qu’il a appris qu’il ne savait pas.' }\n      ] },\n    { n: 9, day: 'Séance de conception — dans la semaine', title: 'Découpage : aggregates et bounded contexts', min: 120,\n      aim: 'Des frontières justifiées par des mesures, des aggregates nommés, des slices et un modèle exporté dans Git.',\n      launch: '« Le mur ne bouge plus. On regarde maintenant où le poser les frontières. L’outil ne propose rien : il mesure ce que chaque frontière coûte en liens traversants. »',\n      consigne: 'Séance architectes. Le mur est figé, les frontières se discutent.',\n      pieges: [\n        { p: 'Découper à l’instinct', r: 'Chaque frontière retenue doit s’appuyer sur au moins une mesure.' },\n        { p: 'Attendre une proposition de l’outil', r: 'Il n’en fait pas. Les mesures sont l’instrument, le jugement reste humain.' }\n      ] }\n  ];\n\n  ROLES = { expert: 'Expert métier', dev: 'Dev praticien', coach: 'Coach agile', archi: 'Architecte', autre: 'Contributeur' };\n\n  ACCOUNT = { name: 'Sébastien Degodez', handle: '@SebastienDegodez', org: 'event2spec', initials: 'SD' };\n\n  state = this.initial();\n\n  initial() {\n    const p = this.props || {};\n    const start = p.startAt || 'Exploration (J1)';\n    const phase = start === 'Lancement (J1)' ? 1 : start === 'Process (J2)' ? 6 : start === 'Découpage' ? 9 : 2;\n    const done = {};\n    for (let i = 1; i < (phase || 1); i++) done[i] = true;\n    const entree = p.entree || 'Connexion';\n    return {\n      stage: entree === 'Choix de session' ? 'sessions' : entree === 'Atelier' ? 'app' : 'signin',\n      account: entree === 'Connexion' ? null : Object.assign({}, this.ACCOUNT),\n      signing: '', joinCode: '', joinName: '', joinErr: '',\n      sessions: this.seedSessions(), sessionId: 'dab',\n      newName: '', newDomain: '', newDates: '', newTpl: 'Big Picture 2 jours (Brandolini)',\n      view: p.defaultView || 'Facilitateur',\n      phase, done,\n      secs: (this.PHASES[Math.max(0, phase - 1)] || this.PHASES[0]).min * 60,\n      running: false,\n      notes: this.seedNotes(),\n      participants: this.seedParticipants(),\n      warmup: [{ id: 'w1', text: 'La pizza a été commandée' }, { id: 'w2', text: 'Le paiement a été accepté' }, { id: 'w3', text: 'La pizza a été préparée' }, { id: 'w4', text: 'Le livreur a été affecté' }, { id: 'w5', text: 'La pizza a été livrée' }, { id: 'w6', text: 'La commande a été annulée' }],\n      warmupText: '', warmupWarn: '',\n      cols: this.COLS_SEED.slice(), review: {}, revealWall: false, procPool: [],\n      draft: '', sel: [], deduped: false, tri: false, votesLeft: 3,\n      inline: null, inlineText: '', cmdEdit: null, cmdText: '',\n      ghostsOn: false, imported: false, ghosts: [],\n      narrator: 'Sylvie Marchand', pass: 1, walk: 0, divergences: {}, divText: '', divWarn: '',\n      railOpen: true, asideOpen: true,\n      processes: ['Déclaration et instruction du sinistre'],\n      chains: this.seedChains(),\n      alts: [], contexts: [], terms: this.seedTerms(), termEdit: -1, termText: '',\n      nudged: {}, exportOpen: false, importOpen: false, committed: false, nid: 500\n    };\n  }\n\n  seedSessions() {\n    const p = this.props || {};\n    return [\n      { id: 'dab', label: p.sessionName || 'Dommage aux biens — cadrage · 15-16 sept. 2026', domain: 'Dommage au , ok: s.processes.length >= 2 && s.processes.length <= 3 && c >= 4, hint: s.processes.length + ' processus · ' + c + ' commandes' };\n    }\n    if (n === 7) {\n      const inP = s.chains.filter(x => s.processes.indexOf(x.proc) >= 0);\n      const c = inP.filter(x => x.rule).length;\n      const trig = inP.filter(x => x.rule || x.info || x.actor).length;\n      return {\n        label: 'Au moins trois politiques explicites, et chaque commande a un déclencheur — politique ou acteur informé',\n        ok: c >= 3 && trig === inP.length && inP.length > 0,\n        hint: c + ' / 3 politiques · ' + this.pl(inP.length - trig, 'commande sans déclencheur', 'commandes sans déclencheur')\n      };\n    }\n    if (n === 8) return { label: 'Au moins deux chemins alternatifs déroulés', ok: s.alts.length >= 2, hint: s.alts.length + ' / 2 variantes' };\n    const free = events.filter(x => x.col && !x.ctx).length;\n    const aggOk = s.contexts.length > 0 && s.contexts.every(c => (c.aggregates || []).length > 0);\n    return { label: 'Tous les événements dans une frontière, un aggregate par frontière, modèle exporté', ok: free === 0 && aggOk && s.committed && s.contexts.length >= 2, hint: this.pl(s.contexts.length, 'frontière', 'frontières') + ' · ' + this.pl(free, 'événement hors frontière', 'événements hors frontière') + ' · ' + (s.committed ? 'exporté' : 'non exporté') };\n  }\n\n  measures() {\n    const s = this.state;\n    const seq = this.seq();\n    const cross = [];\n    for (let i = 1; i < seq.length; i++) {\n      const a = seq[i - 1], b = seq[i];\n      if (a.ctx && b.ctx && a.ctx !== b.ctx) cross.push({ a, b });\n    }\n    const name = id => (s.contexts.find(c => c.id === id) || {}).name || '—';\n    const orphans = seq.filter(n => !s.chains.some(c => c.out === n.text) && !s.notes.some(x => x.type === 'actor' && x.col === n.col));\n    const actorSpan = {};\n    s.notes.filter(n => n.type === 'actor').forEach(a => {\n      const set = {};\n      seq.forEach(e => { if (e
